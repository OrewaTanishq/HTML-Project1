<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Sign-In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <img src="image.png" alt="Prime Video Logo" width="200">

  <div class="box">
  <h2>Sign-In</h2>

  <label>Email (phone for mobile accounts)</label>
  <input type="text">

  <label>Password <a href="#">Forgot Password</a></label>
  <input type="password">

  <button class="primary">Sign-In</button>

  <p class="text">
    By signing-in you agree to Amazon's
    <a href="#">Conditions of Use</a> &
    <a href="#">Privacy Notice</a>.
  </p>

  <div class="divider">New to Amazon?</div>

  <a href="register.html">
    <button class="secondary">Create your Amazon account</button>
  </a>
</div>


</body>
</html>
